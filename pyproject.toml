[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champollion-pipeline"
version = "0.2.22"
description = "End-to-end pipeline: raw T1 MRI → sulcal embeddings via cortical tiles and contrastive learning."
requires-python = ">=3.10"
license = { text = "CeCILL" }
authors = [{ name = "Neurospin", email = "barth.drabczuk@gmail.com" }]
dependencies = [
    "champollion-utils",
    "huggingface-hub>=0.20.0",
    "scipy>=1.10",
    "numpy>=1.24",
    "joblib>=1.3",
    "umap-learn>=0.5",
]

[project.urls]
Repository = "https://github.com/neurospin/champollion_pipeline"

[project.scripts]
champollion-morphologist = "champollion_pipeline.generate_morphologist_graphs:main"
champollion-cortical-tiles = "champollion_pipeline.run_cortical_tiles:main"
champollion-config = "champollion_pipeline.generate_champollion_config:main"
champollion-embeddings = "champollion_pipeline.generate_embeddings:main"
champollion-combine = "champollion_pipeline.put_together_embeddings:main"
champollion-snapshots = "champollion_pipeline.generate_snapshots:main"
champollion-train = "champollion_pipeline.train_champollion:main"
champollion-prune = "champollion_pipeline.prune_failed_subjects:main"
champollion-purge = "champollion_pipeline.purge_subject:main"

[tool.hatch.build.targets.wheel]
packages = ["src/champollion_pipeline"]

[tool.ruff]
line-length = 120
exclude = [".pixi", "external"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: slower integration tests",
    "smoke: minimal smoke tests",
]
