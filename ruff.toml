line-length = 120
exclude = [".pixi", "__pycache__", "external", "*.pyc"]

[lint]
select = ["E", "F", "I", "PLC0415", "UP", "B", "SIM", "C90", "PLR0913", "PLR0915"]
extend-ignore = ["E203"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-args = 5
max-statements = 50

[lint.per-file-ignores]
"__init__.py" = ["F401"]
